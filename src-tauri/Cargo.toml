[package]
name = "zomello"
version = "0.5.3"
description = "Zomello: local-first kanban & planner"
edition = "2021"

[lib]
name = "zomello_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
# https for calendar feeds and Zomello Servers (and, on desktop, the phone server).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
http-body-util = "0.1"
bytes = "1"
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["tokio", "service"] }
mdns-sd = "0.21"

# Desktop only (Windows, macOS, Linux): tray icon, start at login, one running copy, and the
# phone & tablet server. The Android and iPhone/iPad apps leave these out.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
sha2 = "0.10"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Phones and tablets only: scanning your computer's pairing QR code.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Linux only: turn on WebKitGTK's spell checker (Windows' WebView2 has it built in).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
