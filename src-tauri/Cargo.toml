[package]
name = "zomello"
version = "0.1.0"
description = "Zomello: local-first kanban & planner"
edition = "2021"

[lib]
name = "zomello_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
# Phone & tablet access: a small web server on the home network.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
# https for devices (needed for Chrome's "Install app"): our own certificate authority + TLS on the same port.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
http-body-util = "0.1"
bytes = "1"
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
sha2 = "0.10"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Linux only: turn on WebKitGTK's spell checker (Windows' WebView2 has it built in).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
