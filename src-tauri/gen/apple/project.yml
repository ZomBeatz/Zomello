name: zomello
options:
  bundleIdPrefix: com.zombeatz.zomello
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Zomello
      PRODUCT_BUNDLE_IDENTIFIER: com.zombeatz.zomello
      DEVELOPMENT_TEAM: QYN992WB7T
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  zomello_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: zomello_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: zomello_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.5.4
        CFBundleVersion: "0.5.4"
    entitlements:
      path: zomello_iOS/zomello_iOS.entitlements
      properties:
        # Shared with the My Day widget and "Add to Zomello" (ZomelloWidget, ZomelloShare).
        com.apple.security.application-groups: [group.com.zombeatz.zomello]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # The hidden styles' app icons (Settings > Appearance > App icon), from scripts/make-style-icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-BassDrop AppIcon-PartyCat
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: ZomelloWidget
      - target: ZomelloShare
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  # The My Day home-screen widget (reads what Zomello writes to the app group).
  ZomelloWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ZomelloWidget
    info:
      path: ZomelloWidget/Info.plist
      properties:
        CFBundleDisplayName: My Day
        CFBundleShortVersionString: 0.5.4
        CFBundleVersion: "0.5.4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ZomelloWidget/ZomelloWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zombeatz.zomello]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zombeatz.zomello.widget
        DEVELOPMENT_TEAM: QYN992WB7T
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # "Add to Zomello" in the share sheet (leaves what was shared in the app group for Zomello).
  ZomelloShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ZomelloShare
    info:
      path: ZomelloShare/Info.plist
      properties:
        CFBundleDisplayName: Zomello
        CFBundleShortVersionString: 0.5.4
        CFBundleVersion: "0.5.4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ZomelloShare/ZomelloShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zombeatz.zomello]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zombeatz.zomello.share
        DEVELOPMENT_TEAM: QYN992WB7T
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    dependencies:
      - sdk: Social.framework
      - sdk: UniformTypeIdentifiers.framework
