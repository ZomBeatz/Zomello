# Zomello Server, using the published image (no source code needed on the server).
#
# 1. docker compose up -d
# 2. Open http://<this-server>:7311 and create the admin account.
#
# Update later with:  docker compose pull && docker compose up -d
services:
  zomello:
    image: ghcr.io/zombeatz/zomello-server:latest
    container_name: zomello
    restart: unless-stopped
    ports:
      - "7311:7311"
    volumes:
      - zomello-data:/data
    environment:
      # The address people type, shown on the Admin page. Optional.
      # ZOMELLO_PUBLIC_URL: "https://zomello.example.com"

      # https. Leave off when Caddy, Nginx or Traefik serve https in front of Zomello.
      #   self:  Zomello makes its own certificate (install it on each device from the sign-in page)
      #   files: use your own certificate, e.g. mounted into /certs
      ZOMELLO_TLS: "off"
      # ZOMELLO_HOSTS: "zomello.lan,192.168.1.50"   # names/addresses for the `self` certificate
      # ZOMELLO_TLS_CERT: /certs/fullchain.pem
      # ZOMELLO_TLS_KEY: /certs/privkey.pem

      # Let the Zomello app find this server on your network ("Find servers on this network").
      # Needs host networking: uncomment network_mode below too (and remove the ports: lines).
      # ZOMELLO_DISCOVERY: "on"
      # ZOMELLO_NAME: "Our Zomello"
    # network_mode: host

volumes:
  zomello-data:
