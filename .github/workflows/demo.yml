# Publishes the online demo to GitHub Pages: https://zombeatz.github.io/Zomello/
# It's the web version of the app with example boards. Each visitor's changes stay in their own browser.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Online demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "package*.json", "vite.config.ts", ".github/workflows/demo.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build the demo
        run: npx vite build --outDir demo-site
        env:
          VITE_DEMO: "1"
          ZOMELLO_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
