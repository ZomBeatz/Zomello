# Builds Zomello Server (one program with the web app inside) for Windows, macOS and Linux (PCs and
# Raspberry Pis). Runs from the Actions tab, on version tags (adds the files to the draft release), and
# whenever the server changes on master/main. The Docker image has its own workflow (docker.yml).
name: Server downloads

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [master, main]
    paths: ["server/**", "src/**", "public/**", ".github/workflows/server.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  server:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: zomello-server-linux-x64
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            file: zomello-server-linux-arm64
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: zomello-server-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            file: zomello-server-macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            file: zomello-server-macos-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./server -> target"
          key: ${{ matrix.target }}

      # Linux builds use zig as the linker, so they run on older Linux versions too (glibc 2.17+)
      # and the Raspberry Pi build can be made on a normal PC.
      - name: Build (Linux)
        if: matrix.zig
        working-directory: server
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang cargo-zigbuild
          export PATH="$RUNNER_TEMP/zig/bin:$PATH"
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17

      - name: Build
        if: ${{ !matrix.zig }}
        working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the file
        shell: bash
        run: |
          mkdir -p out
          src=server/target/${{ matrix.target }}/release/zomello-server
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "out/${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: out/${{ matrix.file }}

      - name: Add to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "out/${{ matrix.file }}" --clobber || echo "No release yet; the file is in the run's artifacts."
