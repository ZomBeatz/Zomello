# Builds the Zomello apps on GitHub's machines: Windows, Linux, macOS and Android.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0.
# Every run keeps the files under the run's "Artifacts"; a tag also makes a draft release with them.
#
# Optional secrets (Settings → Secrets and variables → Actions), see docs/apps.md:
#   macOS signing:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#                    and for notarizing APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Android signing: ANDROID_KEYSTORE (base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ""
          - platform: ubuntu-22.04
            name: linux
            args: ""
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Sign (and notarize) the Mac app only when the Apple secrets exist; otherwise it's built unsigned.
      - name: Apple signing (if set up)
        if: matrix.name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<ZOMELLO_EOF"; echo "${!v}"; echo "ZOMELLO_EOF"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Zomello ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: zomello-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Microsoft Store package (.msix). Upload it in Partner Center; the Store signs it, no certificate needed.
  msix:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build the app
        run: npx tauri build --no-bundle

      - name: Package it for the Microsoft Store
        shell: pwsh
        run: |
          $id = Get-Content src-tauri/msix/store-identity.json -Raw | ConvertFrom-Json
          if ($id.name -like "PASTE*" -or $id.publisher -like "PASTE*") {
            Write-Output "::warning::src-tauri/msix/store-identity.json still has placeholders: fill it in from Partner Center (see docs/apps.md). Skipping the .msix."
            exit 0
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $parts = $version.Split("-")[0].Split(".")
          while ($parts.Count -lt 3) { $parts += "0" }
          $msixVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"   # the Store wants the last number 0

          $layout = "msix-layout"
          New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
          Copy-Item src-tauri/target/release/zomello.exe $layout/
          foreach ($f in "StoreLogo.png", "Square44x44Logo.png", "Square71x71Logo.png", "Square150x150Logo.png", "Square310x310Logo.png") {
            Copy-Item "src-tauri/icons/$f" "$layout/Assets/$f"
          }
          (Get-Content src-tauri/msix/AppxManifest.template.xml -Raw) `
            -replace "{{NAME}}", $id.name `
            -replace "{{PUBLISHER}}", $id.publisher `
            -replace "{{PUBLISHER_DISPLAY_NAME}}", $id.publisherDisplayName `
            -replace "{{VERSION}}", $msixVersion |
            Set-Content -Encoding utf8 "$layout/AppxManifest.xml"

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Force out | Out-Null
          & $makeappx.FullName pack /d $layout /p "out/Zomello_$($msixVersion)_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: zomello-microsoft-store
          path: out/*.msix
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # GitHub's machines come with the Android SDK and NDK (and their licenses already accepted).
      # The Android project itself is in the repository (src-tauri/gen/android): icons, and the setting
      # that trusts certificates you install on the phone (your Zomello computer's).
      - name: Android tools
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build the APK
        run: npx tauri android build --apk --ci

      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
            PASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"
          else
            # No signing key set up yet: sign with a throwaway key so the APK installs for testing.
            # (Phones won't update it over a copy signed with a different key; uninstall first.)
            echo "::warning::No ANDROID_KEYSTORE secret: this APK is test-signed. See docs/apps.md to set up your own key."
            PASS=zomello-test; ALIAS=zomello
            keytool -genkeypair -keystore release.jks -storepass $PASS -keypass $PASS -alias $ALIAS \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Zomello test"
          fi
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          mkdir -p out
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out out/Zomello.apk aligned.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: zomello-android
          path: out/Zomello.apk
          if-no-files-found: error

      - name: Add to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" out/Zomello.apk --clobber || echo "No release yet; the APK is in the run's artifacts."
