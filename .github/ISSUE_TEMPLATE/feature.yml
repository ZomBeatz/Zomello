name: Feature idea
description: Something Zomello could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The thing you want to get done, not just the feature. "I want to see two boards at once" helps more than "add split view", because there may be a better way to solve it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Zomello, another app, or on paper.
  - type: textarea
    id: idea
    attributes:
      label: Your idea, if you have one
